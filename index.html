<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위기지만 괜찮아 · 실시간 참여</title>
<style>
  :root{
    --dark:#0E3B43; --teal:#1F8A84; --teal2:#2FA79F; --mint:#DDF1EE; --mint2:#EEF8F6;
    --tang:#F28C28; --tangl:#FDEBD7; --ink:#1F2A30; --muted:#5B6B70; --line:#C9DEDB; --white:#fff; --red:#C8463D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--mint2);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
  button{font-family:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  header.top{background:var(--dark);color:#fff;padding:18px 16px 16px}
  header.top .k{color:var(--tang);font-size:12px;font-weight:700;letter-spacing:.02em}
  header.top h1{margin:4px 0 0;font-size:22px}
  .card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .card h2{margin:0 0 4px;font-size:19px;color:var(--dark)}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .opts{display:grid;gap:10px}
  .opts.g2{grid-template-columns:1fr 1fr}
  .opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 12px;font-size:16px;text-align:left;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:center;min-height:52px}
  .opt .em{font-size:24px}
  .opt.on{border-color:var(--teal);background:var(--mint)}
  .opt.on.tg{border-color:var(--tang);background:var(--tangl)}
  textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--teal)}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:var(--teal);color:#fff;cursor:pointer;margin-top:14px}
  .btn:disabled{opacity:.5}
  .btn.tg{background:var(--tang)}
  .done{background:var(--mint);color:var(--dark);border-radius:12px;padding:12px;font-size:15px;margin-top:12px;display:none}
  .qlabel{font-weight:700;font-size:15px;margin:16px 0 8px;color:var(--dark)}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg{display:flex;gap:8px;margin-bottom:6px}
  .seg .opt{flex:1;justify-content:center;font-weight:700}
  .muted{color:var(--muted);font-size:13px}
  .err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
  /* ---------- board ---------- */
  body.board{background:#fff}
  .bwrap{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  .side{background:var(--dark);color:#fff;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
  .side h1{margin:0;font-size:22px}
  .side .k{color:var(--tang);font-size:13px;font-weight:700}
  .qr{background:#fff;border-radius:14px;padding:12px;text-align:center}
  .qr img{width:100%;max-width:240px;display:block;margin:0 auto}
  .qr .u{color:var(--ink);font-size:11px;word-break:break-all;margin-top:6px}
  .tabs{display:grid;gap:8px}
  .tab{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:11px 12px;font-size:15px;text-align:left;cursor:pointer}
  .tab.on{background:var(--tang);border-color:var(--tang);font-weight:700}
  .sidefoot{margin-top:auto;font-size:12px;color:#BFE3DE}
  .sidefoot button{background:none;border:1px solid rgba(255,255,255,.3);color:#BFE3DE;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;margin-top:6px}
  .main{padding:28px 36px;overflow:auto}
  .main h2{font-size:30px;margin:0;color:var(--dark)}
  .main .n{color:var(--teal);font-weight:700;font-size:18px;margin:6px 0 22px}
  .bars{display:grid;gap:12px}
  .bar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;font-size:20px}
  .bar .lab{font-weight:700}
  .bar .tr{background:var(--mint2);border-radius:8px;height:38px;overflow:hidden}
  .bar .fl{height:100%;background:var(--teal);border-radius:8px;transition:width .6s ease}
  .bar.tg .fl{background:var(--tang)}
  .bar .v{font-weight:700;color:var(--dark)}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .legend{display:flex;gap:18px;font-size:15px;margin-bottom:14px;color:var(--muted)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
  .mini .bar{grid-template-columns:80px 1fr 130px;font-size:16px;gap:10px}
  .stat .tr{background:#fff}
  .mini .bar .tr{height:22px}
  .pair{display:grid;gap:4px}
  .stat{background:var(--mint2);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .stat .t{font-weight:700;font-size:17px;color:var(--dark);margin-bottom:10px}
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:20px}
  .note{background:var(--tangl);border-radius:12px;padding:14px;font-size:17px;line-height:1.45}
  .note.c{background:var(--mint)}
  .note .tg{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
  .empty{color:var(--muted);font-size:18px;margin-top:20px}
  @media (max-width:900px){.bwrap{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 80px;font-size:16px}.cmp{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ▼▼ 구글 Apps Script 웹앱 주소 (배포 URL, /exec 로 끝남) ▼▼ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyw9aFTJpyleJGdUA_IdtEbe1nV4K8YBj21dyQzNu0Wa2u3OddEg5i3G_WlQG0DeSOc/exec';
/* ▲▲ 다른 배포 주소를 쓰면 위 한 줄만 바꾸세요 ▲▲ */

const Q = new URLSearchParams(location.search);
const VIEW = Q.get('view') === 'board' ? 'board' : 'join';
const KEY = Q.get('key') || '';
const APP_URL = location.origin + location.pathname;   // 참여자용 주소(QR)

/* ---------- 공통: 구글 시트와 주고받기 ---------- */
async function run(fn, ...a) {
  const p = new URLSearchParams();
  if (fn === 'getState') p.set('api', 'state');
  else if (fn === 'getResults') { p.set('api', 'results'); p.set('act', a[0]); }
  else if (fn === 'submit') { p.set('api', 'submit'); p.set('act', a[0]); p.set('cid', a[1]); p.set('data', JSON.stringify(a[2])); }
  else if (fn === 'setActivity') { p.set('api', 'setActivity'); p.set('key', a[0]); p.set('act', a[1]); }
  else if (fn === 'resetActivity') { p.set('api', 'reset'); p.set('key', a[0]); p.set('act', a[1]); }
  p.set('_', Date.now());
  const res = await fetch(API_URL + '?' + p.toString(), { method: 'GET', redirect: 'follow', credentials: 'omit', cache: 'no-store' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '오류');
  return j.data;
}
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
let CLIENT = '';
try { CLIENT = localStorage.getItem('cid') || ''; } catch (e) {}
if (!CLIENT) { CLIENT = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); try { localStorage.setItem('cid', CLIENT); } catch (e) {} }

const WEATHER = [
  { id: 'sun', em: '☀️', t: '맑음', s: '가볍고 좋아요' },
  { id: 'cloud', em: '⛅', t: '구름 조금', s: '그럭저럭 괜찮아요' },
  { id: 'rain', em: '🌧️', t: '비', s: '지치고 무거워요' },
  { id: 'storm', em: '⛈️', t: '천둥번개', s: '요즘 정말 힘들어요' },
];
const HANDS = [
  '참여자 전화를 받기 전에 숨부터 한 번 고른 적이 있다',
  '퇴근 후에도 그 참여자 말이 계속 떠오른 적이 있다',
  '"이걸 위에 보고해도 되나?" 망설인 적이 있다',
  '개인 휴대폰으로 참여자 연락을 받은 적이 있다',
  '센터에 위기대응 매뉴얼이 있는지 정확히 모른다',
  '위기 상황에서 혼자 대응한 적이 있다',
];
const RISKS = ['신체적', '언어적', '정서적', '성적', '의료적', '경제적', '정보적'];
// 부산 지역자활센터 실무자 실태조사(2024, 156명) 빈도 1순위 %
const BUSAN_Q1 = [5.8, 25.6, 57.7, 0, 0, 9.0, 1.9];
const BUSAN = { q2: 31.4, q3: 28.2 };
const TITLES = {
  weather: '오늘 내 마음의 날씨는?',
  hands: '"나도 그런 적 있다"',
  survey: '제주 즉석 실태조사',
  question: '강사에게 질문하기',
  action: '다음 달까지 할 한 가지',
};

/* =================== 참여자 화면 =================== */
function joinView() {
  const app = document.getElementById('app');
  let current = null;
  const head = el('header', { class: 'top' },
    el('div', { class: 'k' }, '제주 지역자활센터 실무자 교육'),
    el('h1', null, '위기지만, 괜찮아'));
  const body = el('div', { class: 'wrap' });
  app.append(head, body);

  async function tick() {
    try {
      const st = await run('getState');
      if (st.activity !== current) { current = st.activity; render(current); }
    } catch (e) { /* 네트워크 일시 오류는 다음 주기에 재시도 */ }
  }
  tick(); setInterval(tick, 4000);

  function render(act) {
    body.innerHTML = '';
    const card = el('div', { class: 'card' });
    body.append(card, el('p', { class: 'muted' }, '익명으로 저장됩니다. 강사가 다음 활동으로 넘기면 화면이 자동으로 바뀝니다.'));
    ({ weather: wForm, hands: hForm, survey: sForm, question: qForm, action: aForm })[act](card);
  }

  function submitBox(card, getData, opts) {
    opts = opts || {};
    const err = el('div', { class: 'err' });
    const done = el('div', { class: 'done' }, opts.doneText || '제출했어요 ✓ 바꾸고 싶으면 다시 고르고 제출하면 됩니다.');
    const btn = el('button', { class: 'btn' + (opts.tg ? ' tg' : ''), onclick: async () => {
      const d = getData();
      if (!d) { err.textContent = opts.need || '먼저 선택해 주세요'; return; }
      btn.disabled = true; err.textContent = '';
      try { await run('submit', opts.act, CLIENT, d); done.style.display = 'block'; if (opts.after) opts.after(); }
      catch (e) { err.textContent = '저장하지 못했어요. 다시 눌러주세요.'; }
      btn.disabled = false;
    } }, opts.label || '제출하기');
    card.append(btn, err, done);
  }

  function wForm(card) {
    let pick = null;
    card.append(el('h2', null, TITLES.weather), el('p', { class: 'sub' }, '지금 마음에 가장 가까운 날씨를 골라주세요'));
    const box = el('div', { class: 'opts' });
    WEATHER.forEach(w => {
      const b = el('button', { class: 'opt', onclick: () => { pick = w.id; [...box.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); } },
        el('span', { class: 'em' }, w.em), el('span', null, el('b', null, w.t), el('br'), el('span', { class: 'muted' }, w.s)));
      box.append(b);
    });
    const reason = el('input', { type: 'text', maxlength: 60, placeholder: '그 이유를 한 줄로 (선택)' });
    card.append(box, el('div', { class: 'qlabel' }, '이유 한 줄'), reason);
    submitBox(card, () => pick ? { w: pick, reason: reason.value.trim() } : null, { act: 'weather' });
  }

  function hForm(card) {
    const yes = new Set();
    card.append(el('h2', null, TITLES.hands), el('p', { class: 'sub' }, '해당되는 것을 모두 눌러주세요 (없으면 바로 제출)'));
    const box = el('div', { class: 'opts' });
    HANDS.forEach((h, i) => {
      const b = el('button', { class: 'opt', onclick: () => { yes.has(i) ? yes.delete(i) : yes.add(i); b.classList.toggle('on'); } },
        el('span', { class: 'em' }, '✋'), el('span', null, h));
      box.append(b);
    });
    card.append(box);
    submitBox(card, () => ({ yes: [...yes] }), { act: 'hands' });
  }

  function sForm(card) {
    const ans = { q1: null, q2: null, q3: null, q4: null };
    card.append(el('h2', null, TITLES.survey), el('p', { class: 'sub' }, '부산 지역자활센터 실무자 156명의 결과와 바로 비교합니다'));
    card.append(el('div', { class: 'qlabel' }, 'Q1. 최근 1년, 가장 자주 겪은 위험 1개'));
    const g = el('div', { class: 'opts g2' });
    RISKS.forEach((r, i) => {
      const b = el('button', { class: 'opt', onclick: () => { ans.q1 = i; [...g.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); } }, r + ' 위험');
      g.append(b);
    });
    card.append(g);
    const yn = (key, label) => {
      card.append(el('div', { class: 'qlabel' }, label));
      const row = el('div', { class: 'yn' });
      [['예', true], ['아니오', false]].forEach(([t, v]) => {
        const b = el('button', { class: 'opt', onclick: () => { ans[key] = v; [...row.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); } }, t);
        row.append(b);
      });
      card.append(row);
    };
    yn('q2', 'Q2. 위기대응 교육을 받은 적이 있다');
    yn('q3', 'Q3. 위기 때 혼자 해결한 적이 있다');
    yn('q4', 'Q4. 우리 센터 위기대응팀(담당자)을 안다');
    submitBox(card, () => (ans.q1 === null || ans.q2 === null || ans.q3 === null || ans.q4 === null) ? null : ans,
      { act: 'survey', need: '네 문항 모두 골라주세요' });
  }

  function freeForm(card, act, title, sub, ph, withType) {
    let type = withType ? '나' : '';
    card.append(el('h2', null, title), el('p', { class: 'sub' }, sub));
    if (withType) {
      const seg = el('div', { class: 'seg' });
      ['나', '우리 센터'].forEach((t, i) => {
        const b = el('button', { class: 'opt' + (i === 0 ? ' on' : ''), onclick: () => { type = t; [...seg.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); } }, t);
        seg.append(b);
      });
      card.append(seg);
    }
    const ta = el('textarea', { rows: 3, maxlength: 180, placeholder: ph });
    card.append(ta);
    submitBox(card, () => ta.value.trim() ? { type, text: ta.value.trim() } : null,
      { act, need: '내용을 적어주세요', label: '보내기', tg: true, doneText: '보냈어요 ✓ 더 보내셔도 됩니다.', after: () => { ta.value = ''; } });
  }
  function qForm(card) { freeForm(card, 'question', TITLES.question, '익명으로 화면에 올라갑니다. 우리 센터 사례도 좋아요', '궁금한 점을 적어주세요', false); }
  function aForm(card) { freeForm(card, 'action', TITLES.action, '나 개인 또는 우리 센터가 다음 달까지 할 일 한 가지', '예) 업무용 번호만 안내하기', true); }
}

/* =================== 강사 화면 =================== */
function boardView() {
  document.body.classList.add('board');
  const app = document.getElementById('app');
  let act = 'weather';
  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=8&data=' + encodeURIComponent(APP_URL);
  const tabs = el('div', { class: 'tabs' });
  const main = el('div', { class: 'main' });
  const keyNote = el('div', { class: 'err', style: 'color:#FFD2B0' });
  const side = el('div', { class: 'side' },
    el('div', null, el('div', { class: 'k' }, '휴대폰 카메라로 QR을 찍어주세요'), el('h1', null, '위기지만, 괜찮아')),
    el('div', { class: 'qr' }, el('img', { src: qrSrc, alt: '참여 QR 코드' }), el('div', { class: 'u' }, APP_URL)),
    tabs, keyNote,
    el('div', { class: 'sidefoot' }, '3초마다 자동으로 새로고침됩니다',
      el('br'), el('button', { onclick: resetCurrent }, '이 활동 응답 지우기 (리허설 후)')));
  app.append(el('div', { class: 'bwrap' }, side, main));

  Object.keys(TITLES).forEach(a => {
    const b = el('button', { class: 'tab', 'data-a': a, onclick: () => go(a) }, TITLES[a]);
    tabs.append(b);
  });
  function markTabs() { [...tabs.children].forEach(b => b.classList.toggle('on', b.getAttribute('data-a') === act)); }

  async function go(a) {
    act = a; markTabs(); main.innerHTML = ''; main.append(el('div', { class: 'empty' }, '불러오는 중…'));
    try { await run('setActivity', KEY, a); keyNote.textContent = ''; }
    catch (e) { keyNote.textContent = '관리자 키가 달라 참여자 화면은 바뀌지 않았어요 (주소의 key 확인)'; }
    refresh();
  }
  async function resetCurrent() {
    if (!window.confirm || !confirm('"' + TITLES[act] + '" 응답을 모두 지울까요?')) return;
    try { await run('resetActivity', KEY, act); refresh(); } catch (e) { keyNote.textContent = '관리자 키가 맞지 않아 지우지 못했어요'; }
  }

  (async () => { try { const st = await run('getState'); act = st.activity; } catch (e) {} markTabs(); refresh(); })();
  setInterval(refresh, 3000);

  async function refresh() {
    let r;
    try { r = await run('getResults', act); } catch (e) { return; }
    if (r.activity !== act) return;
    main.innerHTML = '';
    main.append(el('h2', null, TITLES[act]));
    ({ weather: wBoard, hands: hBoard, survey: sBoard, question: listBoard, action: listBoard })[act](r);
  }

  function bar(label, value, max, text, tg) {
    const pct = max > 0 ? Math.round(value / max * 100) : 0;
    return el('div', { class: 'bar' + (tg ? ' tg' : '') },
      el('div', { class: 'lab' }, label),
      el('div', { class: 'tr' }, el('div', { class: 'fl', style: 'width:' + pct + '%' })),
      el('div', { class: 'v' }, text));
  }
  function wBoard(r) {
    main.append(el('div', { class: 'n' }, r.n + '명 참여'));
    const max = Math.max(1, ...Object.values(r.counts));
    const box = el('div', { class: 'bars' });
    WEATHER.forEach((w, i) => box.append(bar(w.em + ' ' + w.t, r.counts[w.id], max, r.counts[w.id] + '명', i >= 2)));
    main.append(box);
    const wall = el('div', { class: 'wall' });
    r.reasons.forEach(x => {
      const w = WEATHER.find(v => v.id === x.w) || { em: '' };
      wall.append(el('div', { class: 'note' + (x.w === 'sun' || x.w === 'cloud' ? ' c' : '') }, w.em + ' ' + x.text));
    });
    main.append(wall);
  }
  function hBoard(r) {
    main.append(el('div', { class: 'n' }, r.n + '명 참여 · 손 든 사람 수'));
    const box = el('div', { class: 'bars' });
    HANDS.forEach((h, i) => {
      const b = bar((i + 1) + '', r.yes[i], Math.max(1, r.n), r.yes[i] + ' / ' + r.n, i >= 4);
      b.style.gridTemplateColumns = '40px 1fr 120px';
      box.append(el('div', { class: 'pair' }, el('div', { style: 'font-size:18px;color:#1F2A30' }, (i + 1) + '. ' + h), b));
    });
    main.append(box);
  }
  function sBoard(r) {
    main.append(el('div', { class: 'n' }, '제주 ' + r.n + '명 참여 · 부산 지역자활센터 실무자 156명(2024)과 비교'));
    main.append(el('div', { class: 'legend' }, el('span', null, el('i', { style: 'background:#F28C28' }), '제주 (오늘)'), el('span', null, el('i', { style: 'background:#1F8A84' }), '부산 (2024)')));
    const pctJ = v => r.n ? Math.round(v / r.n * 1000) / 10 : 0;
    const left = el('div', { class: 'stat mini' }, el('div', { class: 't' }, 'Q1. 가장 자주 겪는 위험 1순위 (%)'));
    RISKS.forEach((k, i) => {
      left.append(el('div', { class: 'pair', style: 'margin-bottom:8px' },
        bar(k, pctJ(r.q1[i]), 100, pctJ(r.q1[i]) + '%', true),
        bar('', BUSAN_Q1[i], 100, BUSAN_Q1[i] + '%', false)));
    });
    const right = el('div');
    [['q2', 'Q2. 위기대응 교육을 받은 적 있다'], ['q3', 'Q3. 위기 때 혼자 해결한 적 있다'], ['q4', 'Q4. 우리 센터 위기대응팀을 안다']].forEach(([k, t]) => {
      const s = el('div', { class: 'stat mini' }, el('div', { class: 't' }, t),
        bar('제주', pctJ(r[k]), 100, pctJ(r[k]) + '% (' + r[k] + '명)', true));
      if (BUSAN[k] != null) s.append(bar('부산', BUSAN[k], 100, BUSAN[k] + '%', false));
      else s.append(el('div', { class: 'muted', style: 'margin-top:6px' }, '부산 조사에는 없던 질문'));
      right.append(s);
    });
    main.append(el('div', { class: 'cmp' }, left, right));
  }
  function listBoard(r) {
    main.append(el('div', { class: 'n' }, r.n + '개 도착'));
    if (!r.items.length) { main.append(el('div', { class: 'empty' }, '아직 도착한 글이 없어요')); return; }
    const wall = el('div', { class: 'wall' });
    r.items.forEach(x => wall.append(el('div', { class: 'note' + (x.type === '우리 센터' ? ' c' : '') },
      x.type ? el('span', { class: 'tg' }, x.type) : null, x.text)));
    main.append(wall);
  }
}

if (VIEW === 'board') boardView(); else joinView();
</script>
